name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Server tests
        working-directory: server
        env:
          NODE_ENV: test
          CLIENT_URL: http://localhost:5178
          JWT_SECRET: ci-jwt-secret-please-use-32-chars
          MONGO_URI: mongodb://127.0.0.1:27017/freelancehub_test
          LOG_LEVEL: silent
        run: |
          npm ci
          npm run lint
          npm test
      - name: Client tests and build
        working-directory: client
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
